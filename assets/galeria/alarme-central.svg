<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Central de alarme com teclado">
  <defs>
    <linearGradient id="cBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef0f4"/>
    </linearGradient>
    <pattern id="cGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#e3e6ec" stroke-width="1"/>
    </pattern>
    <radialGradient id="cGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D20005" stop-opacity=".16"/><stop offset="1" stop-color="#D20005" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3038"/><stop offset="1" stop-color="#14171c"/>
    </linearGradient>
    <linearGradient id="cScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1f0e"/><stop offset="1" stop-color="#041007"/>
