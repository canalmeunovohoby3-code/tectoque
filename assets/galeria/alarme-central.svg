    <linearGradient id="cRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ED151A"/><stop offset="1" stop-color="#9E0003"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cBg)"/>
