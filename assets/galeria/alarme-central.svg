      <text x="0" y="-47" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" fill="#fff">2</text>
      <text x="92" y="-47" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" fill="#fff">3</text>
      <text x="-92" y="29" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" fill="#fff">4</text>
